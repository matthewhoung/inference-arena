# =============================================================================
# Prometheus Configuration - Inference Arena
# =============================================================================
#
# Scrape configuration for container metrics collection.
#
# Scrape Interval: 1 second
#   - Required for accurate latency analysis during 180-second measurement phases
#   - Aligns with methodology specification (Ch3 - Container Metrics Collection)
#
# Targets:
#   - OpenTelemetry Collector: Container CPU, memory, network metrics
#
# Author: Matthew Hong
# =============================================================================

global:
  # 1-second scrape interval for fine-grained metrics
  # Required for accurate P99 latency correlation with resource usage
  scrape_interval: 1s

  # Evaluation interval for alerting rules (if any)
  evaluation_interval: 1s

  # Attach these labels to any time series or alerts
  external_labels:
    project: 'inference-arena'
    environment: 'thesis-experiment'

# =============================================================================
# Scrape Configurations
# =============================================================================

scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus Self-Monitoring
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    # Less frequent scrape for self-monitoring (reduce overhead)
    scrape_interval: 15s

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector - Container Metrics
  # ---------------------------------------------------------------------------
  # Scrapes container metrics from OTel Collector's Prometheus exporter.
  #
  # Metrics available (from docker_stats receiver):
  #   - container_cpu_percent: CPU usage percentage (gauge)
  #   - container_cpu_usage_total: CPU usage in nanoseconds (counter)
  #   - container_memory_usage_total: Memory usage in bytes (gauge)
  #   - container_memory_percent: Memory usage percentage (gauge)
  #   - container_network_io_usage_rx_bytes: Network receive bytes (counter)
  #   - container_network_io_usage_tx_bytes: Network transmit bytes (counter)
  #
  # All metrics include container_name label for static queries.
  # Example: container_cpu_percent{container_name="inference-arena-monolithic"}
  #
  # Key queries for thesis analysis:
  #   CPU%: container_cpu_percent{container_name="inference-arena-monolithic"}
  #   Memory MB: container_memory_usage_total{container_name="..."} / 1024 / 1024
  #   Network RX: rate(container_network_io_usage_rx_bytes{container_name="..."}[1m])
  # ---------------------------------------------------------------------------
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    # 1-second interval for precise resource tracking during experiments
    scrape_interval: 1s
    # Timeout must be <= scrape_interval
    scrape_timeout: 1s
    # Honor the labels from OTel Collector (including container_name)
    honor_labels: true

  # ---------------------------------------------------------------------------
  # Architecture Services (Dynamic Discovery)
  # ---------------------------------------------------------------------------
  # When architecture containers are running, they can expose custom metrics
  # on /metrics endpoint. This job discovers them via Docker labels.
  #
  # To enable: Add label 'prometheus.scrape=true' to architecture containers
  # ---------------------------------------------------------------------------
  # NOTE: Uncomment when architecture containers expose custom metrics
  # - job_name: 'architecture-services'
  #   docker_sd_configs:
  #     - host: unix:///var/run/docker.sock
  #       refresh_interval: 5s
  #   relabel_configs:
  #     - source_labels: [__meta_docker_container_label_prometheus_scrape]
  #       regex: 'true'
  #       action: keep
  #     - source_labels: [__meta_docker_container_name]
  #       target_label: container
  #     - source_labels: [__meta_docker_container_label_prometheus_port]
  #       target_label: __address__
  #       replacement: '${1}'
