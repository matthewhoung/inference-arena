# =============================================================================
# Inference Arena - Infrastructure Services
# =============================================================================
#
# This compose file provides shared infrastructure for all architectures:
# - MinIO: S3-compatible model storage
# - OpenTelemetry Collector: Container metrics via docker_stats receiver
# - Prometheus: Time-series metrics database
# - Grafana: Metrics visualization dashboard
#
# Network Topology:
#   - infra-network: Internal metrics aggregation (Prometheus ↔ Grafana)
#   - backend-network: Shared with architecture containers (MinIO, OTel)
#
# Configuration:
#   Copy .env.example to .env and customize as needed.
#   All sensitive values (passwords, ports) can be configured via .env
#
# Usage:
#   docker compose -f infrastructure/docker-compose.infra.yml up -d
#
# Author: Matthew Hong
# Specification Reference: Ch3 Methodology §3.4.5
# =============================================================================

services:
  # ===========================================================================
  # MinIO - S3-Compatible Object Storage
  # ===========================================================================
  # Provides model storage for all architectures. Triton loads models directly
  # via s3://minio:9000/models. Custom architectures download at startup.
  #
  # Ports:
  #   - 9000: S3 API
  #   - 9001: Web Console
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: inference-arena-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ===========================================================================
  # OpenTelemetry Collector - Container Metrics
  # ===========================================================================
  # Replaces cAdvisor for container metrics collection.
  # Uses docker_stats receiver for container.name labels and WSL2 compatibility.
  #
  # Endpoints:
  #   - 8889: Prometheus metrics (scraped by Prometheus)
  #   - 13133: Health check
  #   - 55679: Debug UI (zPages)
  #
  # Benefits over cAdvisor:
  #   - container.name labels for static Grafana dashboards
  #   - Network I/O works in WSL2 (uses Docker API, not cgroups)
  #   - No privileged mode required
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.143.1
    container_name: inference-arena-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    # Add container to docker group for socket access
    group_add:
      - "${DOCKER_GID:-1001}"
    ports:
      - "${OTEL_PROMETHEUS_PORT:-8889}:8889"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
      - "${OTEL_ZPAGES_PORT:-55679}:55679"
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend-network
    restart: unless-stopped

  # ===========================================================================
  # Prometheus - Time-Series Database
  # ===========================================================================
  # Stores container metrics at 1-second scrape intervals for latency analysis.
  # Configured to scrape OpenTelemetry Collector metrics.
  #
  # Retention: 15 days (sufficient for experiment runs)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: inference-arena-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-15d}'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - infra-network
      - backend-network
    depends_on:
      - otel-collector
    restart: unless-stopped

  # ===========================================================================
  # Grafana - Metrics Visualization
  # ===========================================================================
  # Pre-provisioned with Prometheus datasource and infrastructure dashboard.
  # Dashboard shows CPU utilization, memory usage, and network I/O per container.
  #
  # Default credentials: admin / admin
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: inference-arena-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/home.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - infra-network
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
# Two-network topology isolates metrics infrastructure from experiment traffic.
#
# - infra-network: Prometheus ↔ Grafana (internal aggregation)
# - backend-network: MinIO + OTel Collector + Architecture containers
#
# Architecture compose files should attach to backend-network:
#   networks:
#     default:
#       name: inference-arena-backend
#       external: true
# =============================================================================
networks:
  infra-network:
    name: inference-arena-infra
    driver: bridge
  backend-network:
    name: inference-arena-backend
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
# Named volumes for data persistence across container restarts.
# =============================================================================
volumes:
  minio-data:
    name: inference-arena-minio-data
  prometheus-data:
    name: inference-arena-prometheus-data
  grafana-data:
    name: inference-arena-grafana-data
